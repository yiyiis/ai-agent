Server:
  Port: 8888
  IP: 0.0.0.0

DBConf:
  Driver: "mysql"
  Path: 127.0.0.1:3306
  DbName: "ai_agent"
  Username: root
  Password: "your_password"
  Param: "charset=utf8mb4&parseTime=True&loc=Local"

Auth:
  Seconds: 604800
  Secret: "your_jwt_secret_key"
  IgnorePath:
    - /api/ping
    - /api/auth/login
    - /api/auth/register
    - /api/auth/logout
    - /api/models

Log:
  Mode: "default"
  Path: "./logs"

LLM:
  DefaultModel: "MiniMax-Text-01"
  Providers:
    - Name: "minimax"
      BaseURL: "https://api.minimaxi.com/v1"
      ApiKey: "YOUR_MINIMAX_API_KEY"
      Models:
        - "MiniMax-Text-01"
        - "MiniMax-M3"
    - Name: "glm"
      BaseURL: "https://open.bigmodel.cn/api/coding/paas/v4"
      ApiKey: "YOUR_GLM_API_KEY"
      Models:
        - "GLM-5.3"
        - "GLM-5.3-Flash"
        - "GLM-5.2"
        - "GLM-5.1"
        - "GLM-5-Turbo"
        - "GLM-4.7"
  # 计费单价表（阶段七·模块一）：每百万 token 单价（元）。金额仅在用量统计接口
  # 查询时现算（cost_estimate 估算值），不落库——调价不回改历史账单；
  # 未配置的模型金额记 0，token 计数照常统计。CachedInput 缺省按 Input 计。
  Billing:
    - Model: "MiniMax-Text-01"
      Input: 2.0
      Output: 8.0
      CachedInput: 0.2
    - Model: "GLM-5.3"
      Input: 2.0
      Output: 8.0
  # 模型上下文窗口表（token）：上下文组装热区预算与轮内 rezone 的基准。
  # 未配置的模型走默认 131072；glm-5.3-x 等变体按前缀吃这里的配置。
  ContextWindows:
    - Model: "GLM-5.3"
      Window: 131072
    - Model: "MiniMax-Text-01"
      Window: 1000384

# 上下文组装分区策略（热/冷分区 + 图片保留）。零值/缺段保持默认。
#   HotSteps: 按工具的热区 step 阈值（step=一次上游调用）；DefaultHotSteps 兜底
#   HotBudgetRatio: 热区 token 预算（窗口占比），任一条件触顶后更旧条目进冷区（stub）
#   RezoneRatio: ReAct 轮内实测 prompt_tokens 超窗口×此比例时整体分区替换一次
#   ImageKeepLast: 历史图片保留张数（其余换文本占位）
AgentPolicy:
  HotSteps:
    - {Tool: "read_file", Steps: 2}
    - {Tool: "write_file", Steps: 1}
    - {Tool: "edit_file", Steps: 1}
    - {Tool: "bash", Steps: 3}
    - {Tool: "python_exec", Steps: 3}
  DefaultHotSteps: 8
  HotBudgetRatio: 0.25
  RezoneRatio: 0.65
  ImageKeepLast: 2

# 对象存储：聊天附件与 export_artifact 产物统一上 COS（可分享的公网链接）。
# Bucket 留空时附件与产物都落本地 uploads/ 并经 /api/uploads/:name 下载（零依赖部署）。
COS:
  SecretId: "YOUR_TENCENT_COS_SECRET_ID"
  SecretKey: "YOUR_TENCENT_COS_SECRET_KEY"
  Bucket: ""
  Region: "YOUR_COS_REGION"
  BasePath: ""

# 技能库（阶段五）：动态 Skill 插件的文件源头。
# 每个技能是 <Dir>/ 下一个子目录，以 SKILL.md 为入口声明（YAML frontmatter：
# name / description / tags）；机密密钥放 <Dir>/.secrets/<目录名>.env，
# 不随技能文件挂载进沙箱，仅在启用/装载时注入进程环境变量。
Skill:
  Dir: "skills"

# 执行沙箱：进程类工具（bash / python_exec）的执行载体，三驱动可切换
#   local  —— 本地隔离执行（默认，零依赖开箱即用）
#   docker —— 每会话独立容器：工作区目录绑定挂载进容器 /workspace，按需拉起、
#             空闲/超期强制销毁；镜像需自带 bash 与 python3，容器内不可安装系统依赖
#   e2b    —— E2B 云端沙箱：按会话在云端拉起隔离 Linux 虚机，工作区由驱动双向同步；
#             需要 E2BKey，命令在云端执行（默认 base 模板）
Sandbox:
  Driver: "local"
  DockerURL: ""              # tcp://127.0.0.1:2375 / unix:///var/run/docker.sock / npipe:////./pipe/docker_engine，留空按平台默认
  Image: "python:3.12-slim"
  Env: []                    # 注入容器的环境变量（KEY=VALUE）
  Mounts: []                 # 额外挂载 host:container[:ro]，如 /data/assets:/assets:ro
  NetworkMode: "bridge"
  IdleTimeoutSec: 3600       # 空闲 1 小时销毁容器（ephemeral 工作区下适当放宽）
  MaxLifetimeSec: 43200      # 容器最长存活 12 小时
  # 工作区文件经传输 API 进出沙箱（docker: /archive tar 流；e2b: /files REST），
  # 不做宿主 bind 挂载、无需路径映射——三种驱动语义统一，也支持远程 Docker daemon
  MemoryMB: 0                # 沙箱容器内存限额（防失控脚本打爆宿主，0 不限制）
  CPUS: 0                    # CPU 限额（核数，0 不限制）
  PidsLimit: 0               # 进程数限额（0 不限制）
  E2BKey: "YOUR_E2B_API_KEY" # Driver: e2b 时必填
  E2BTemplate: "base"        # E2B 沙箱模板 ID
  E2BTimeoutSec: 1800        # E2B 沙箱 TTL（秒），超时未使用会被云端回收
