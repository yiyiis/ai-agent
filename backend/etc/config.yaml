Server:
  Port: 8888
  IP: 0.0.0.0

DBConf:
  Driver: "mysql"
  Path: 127.0.0.1:3306
  DbName: "ai_agent"
  Username: root
  Password: "your_password"
  Param: "charset=utf8mb4&parseTime=True&loc=Local"

Auth:
  Seconds: 604800
  Secret: "your_jwt_secret_key"
  IgnorePath:
    - /api/ping
    - /api/auth/login
    - /api/auth/register
    - /api/auth/logout
    - /api/models

Log:
  Mode: "default"
  Path: "./logs"

LLM:
  DefaultModel: "MiniMax-Text-01"
  Providers:
    - Name: "minimax"
      BaseURL: "https://api.minimaxi.com/v1"
      ApiKey: "YOUR_MINIMAX_API_KEY"
      Models:
        - "MiniMax-Text-01"
        - "MiniMax-M3"
    - Name: "glm"
      BaseURL: "https://open.bigmodel.cn/api/coding/paas/v4"
      ApiKey: "YOUR_GLM_API_KEY"
      Models:
        - "GLM-5.3"
        - "GLM-5.3-Flash"
        - "GLM-5.2"
        - "GLM-5.1"
        - "GLM-5-Turbo"
        - "GLM-4.7"

COS:
  SecretId: "YOUR_TENCENT_COS_SECRET_ID"
  SecretKey: "YOUR_TENCENT_COS_SECRET_KEY"
  Bucket: "YOUR_COS_BUCKET"
  Region: "YOUR_COS_REGION"
  BasePath: ""

Sandbox:
  E2BKey: "YOUR_E2B_API_KEY"
  DockerURL: ""
