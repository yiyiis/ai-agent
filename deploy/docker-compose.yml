services:
  mysql:
    image: mysql:8.0
    container_name: ai-agent-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ai_agent
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  backend:
    image: 43.138.247.132:3000/qqlhjt/ai-agent-backend:${BACKEND_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    restart: unless-stopped
    stop_grace_period: 600s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8002}:8888"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend/etc:/app/etc:ro
      - ../backend/workspace:/app/workspace
      - ../backend/uploads:/app/uploads
      - ../backend/logs:/app/logs

  frontend:
    image: 43.138.247.132:3000/qqlhjt/ai-agent-frontend:${FRONTEND_TAG:-main}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-agent-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8003}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
